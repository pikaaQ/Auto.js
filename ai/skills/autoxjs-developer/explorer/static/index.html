<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AutoX.js 页面探索工具</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div id="app">
  <header>
    <h1>📱 页面探索工具</h1>
    <div class="header-actions">
      <span id="project-name" class="project-badge">未选择项目</span>
      <button onclick="showProjectSelector()">📂 选择项目</button>
      <button onclick="addPage()">+ 添加页面</button>
    </div>
  </header>

  <!-- 项目选择器 -->
  <div id="project-selector" class="project-selector" style="display:none;">
    <div class="project-selector-inner">
      <h2>选择项目</h2>
      <div id="history-list" class="history-list" style="display:none;">
        <h3>最近使用</h3>
        <div id="history-items"></div>
      </div>
      <h3>扫描到的项目</h3>
      <div id="project-list" class="project-list"></div>
      <div class="project-manual">
        <input type="text" id="manual-path" placeholder="或手动输入项目路径...">
        <button onclick="selectManualPath()">确定</button>
      </div>
      <button class="close-btn" onclick="closeProjectSelector()">取消</button>
    </div>
  </div>

  <div class="main">
    <aside class="sidebar">
      <h2>探索计划 <span id="page-count" class="count-badge"></span></h2>
      <div id="page-list" class="page-list"></div>
    </aside>

    <main class="content">
      <div class="content-body">
        <div class="canvas-area">
          <div class="canvas-container" id="canvas-container">
            <div class="placeholder" id="placeholder">
              <p>选择项目 → 添加页面 → 点击「探索」</p>
              <p>探索完成后截图将在此显示</p>
            </div>
            <div id="image-wrapper" style="display:none;">
              <img id="screenshot-img" crossorigin="anonymous">
              <canvas id="overlay-canvas"></canvas>
            </div>
          </div>
        </div>
        <div class="side-panel">
          <div class="detail-header">
            <h2 id="detail-title">选择项目后开始探索</h2>
            <div class="detail-actions">
              <button id="btn-explore" onclick="explorePage()" disabled>🚀 探索</button>
              <button id="btn-refresh" onclick="refreshResult()" disabled>🔄 刷新</button>
            </div>
          </div>
          <div class="page-info" id="page-info" style="display:none;">
            <div class="info-field">
              <label>页面ID</label>
              <input type="text" id="edit-page-id" disabled>
            </div>
            <div class="info-field">
              <label>页面名称</label>
              <div style="display:flex;gap:4px;">
                <input type="text" id="edit-page-name">
                <button id="btn-save-page" onclick="savePageInfo()" style="padding:4px 8px;font-size:12px;">保存</button>
              </div>
            </div>
          </div>
          <div class="toolbar" id="toolbar" style="display:none;">
            <label class="toggle">
              <input type="radio" name="overlay" id="toggle-dump" onchange="toggleOverlay()">
              <span class="toggle-label">📋 DUMP</span>
            </label>
            <label class="toggle">
              <input type="radio" name="overlay" id="toggle-ocr" onchange="toggleOverlay()">
              <span class="toggle-label">📝 OCR</span>
            </label>
            <label class="toggle">
              <input type="radio" name="overlay" id="toggle-pic" onchange="toggleOverlay()">
              <span class="toggle-label">🖼 找图</span>
            </label>
            <label class="toggle">
              <input type="radio" name="overlay" id="toggle-none" onchange="toggleOverlay()">
              <span class="toggle-label">❌ 关闭</span>
            </label>
          </div>
          <div class="transitions-panel" id="transitions-panel">
            <h3>页面跳转</h3>
            <div id="transitions-status" class="tf-info" style="padding:8px 0;text-align:center;">选择页面后查看跳转</div>
            <div id="transitions-list" style="display:none;"></div>
            <div class="transition-form" id="transition-form" style="display:none;">
              <h4 id="tf-title">选择组件</h4>
              <div id="tf-info" class="tf-info">点击截图中的组件来标注跳转</div>
              <div class="tf-field">
                <label>跳转到：</label>
                <select id="tf-target" disabled>
                  <option>请先选择组件</option>
                </select>
              </div>
              <div class="tf-field">
                <label>识别方式：</label>
                <select id="tf-method" disabled>
                  <option value="ocr">OCR</option>
                  <option value="dump">DUMP</option>
                  <option value="pic">找图</option>
                </select>
              </div>
              <button id="tf-confirm" onclick="confirmTransition()" disabled>确认跳转</button>
            </div>
            <div class="pic-form" id="pic-form" style="display:none;">
              <h4>🖼 找图区域</h4>
              <div id="pic-info" class="tf-info">在截图上拖动鼠标绘制方框</div>
              <div class="tf-field">
                <label>坐标</label>
                <input type="text" id="pic-coords" readonly style="width:100%;padding:4px 6px;border:1px solid #ddd;border-radius:4px;font-size:12px;background:#f5f5f5;">
              </div>
              <div class="tf-field">
                <label>说明</label>
                <input type="text" id="pic-label" placeholder="输入组件说明..." style="width:100%;padding:4px 6px;border:1px solid #ccc;border-radius:4px;font-size:13px;">
              </div>
              <button id="btn-save-pic" onclick="savePicRect()" style="width:100%;padding:6px;background:#1976d2;color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:13px;">保存</button>
            </div>
            <div class="pic-list" id="pic-list" style="display:none;">
              <h4 style="font-size:13px;color:#666;margin:8px 0 4px;">已保存区域</h4>
              <div id="pic-items"></div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
